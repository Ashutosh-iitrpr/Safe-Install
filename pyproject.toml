[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safeinstall"
version = "0.1.0"
description = "Pre-flight security sandbox for packages and repositories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "docker>=7.0",
  "jinja2>=3.1",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "rich>=13.0",
  "streamlit>=1.40",
  "typer>=0.12",
]

[project.scripts]
safeinstall = "safeinstall.cli:app"

[tool.setuptools.packages.find]
include = ["safeinstall*"]

[tool.setuptools.package-data]
safeinstall = ["report/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon and the :test images (make build)"]
addopts = "-m 'not docker'"
